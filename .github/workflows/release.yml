name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Determine Sequential Release Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
          else
            git fetch --tags --force 2>/dev/null || true
            PKG_VERSION=$(node -p "require('./package.json').version")
            IFS='.' read -r MAJOR MINOR _ <<< "$PKG_VERSION"
            
            HIGHEST_PATCH=-1
            for tag in $(git tag -l "v$MAJOR.$MINOR.*"); do
              PATCH="${tag##*.}"
              if [[ "$PATCH" =~ ^[0-9]+$ ]] && [ "$PATCH" -gt "$HIGHEST_PATCH" ]; then
                HIGHEST_PATCH="$PATCH"
              fi
            done
            
            if [ "$HIGHEST_PATCH" -eq -1 ]; then
              NEXT_PATCH=0
            else
              NEXT_PATCH=$((HIGHEST_PATCH + 1))
            fi
            
            VER="$MAJOR.$MINOR.$NEXT_PATCH"
          fi
          
          echo "Calculated version: $VER"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT
          
          # Update version in tauri.conf.json so the .deb filename matches
          node -e "
            const fs = require('fs');
            const file = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(file, 'utf8'));
            conf.version = '$VER';
            fs.writeFileSync(file, JSON.stringify(conf, null, 2));
          "

      - name: Build Debian package (.deb)
        run: npx @tauri-apps/cli build --bundles deb

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafy-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: Wafy ${{ steps.version_step.outputs.tag }}
          draft: false
          prerelease: false
          files: src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
