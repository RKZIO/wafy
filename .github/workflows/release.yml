name: Wafy Production Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Wafy (.deb)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Build Debian package (.deb)
        run: npx @tauri-apps/cli build --bundles deb

      - name: Calculate and tag production release
        id: bump_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Triggered on branch: $BRANCH_NAME"

          # Read base MAJOR and MINOR version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r PKG_MAJ PKG_MIN PKG_PATCH <<< "$PKG_VERSION"
          MAJOR=$PKG_MAJ
          MINOR=$PKG_MIN

          echo "Base version from package.json: $MAJOR.$MINOR.x"

          # Get tags matching current vMAJOR.MINOR.*
          TAGS=$(git tag -l "v$MAJOR.$MINOR.[0-9]*" --sort=v:refname)
          echo "Existing tags for v$MAJOR.$MINOR.x:"
          echo "$TAGS"

          HAS_PROD_TAG=false
          LAST_PROD_PATCH=0

          for tag in $TAGS; do
            CLEAN_TAG=${tag#v}
            IFS='.' read -r tag_maj tag_min tag_patch <<< "$CLEAN_TAG"
            
            # Check for even numbers (Production releases only)
            if [ $((tag_patch % 2)) -eq 0 ]; then
              if [ "$HAS_PROD_TAG" = false ] || [ $tag_patch -gt $LAST_PROD_PATCH ]; then
                LAST_PROD_PATCH=$tag_patch
                HAS_PROD_TAG=true
              fi
            fi
          done

          if [ "$HAS_PROD_TAG" = false ]; then
            # First production release starts at 0 (e.g. 1.0.0)
            NEW_PATCH=0
            echo "No previous production tag found. Starting at: $NEW_PATCH"
          else
            # Subsequent production releases increment by 2 (0 -> 2 -> 4 -> 6...)
            NEW_PATCH=$((LAST_PROD_PATCH + 2))
            echo "Last Production Patch (Even): $LAST_PROD_PATCH"
            echo "Next Production Patch (Even): $NEW_PATCH"
          fi

          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          TAG_NAME="v$NEW_VERSION"

          echo "New calculated version: $NEW_VERSION"
          echo "New tag name: $TAG_NAME"

          # Create and push git tag only (no branch commits)
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.tag }}
          name: Release ${{ steps.bump_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
