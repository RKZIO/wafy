[package]
name = "wafy"
version = "1.0.0"
description = "Ultra-lightweight WhatsApp Web client for Linux"
authors = ["Wafy Contributors <wafy@github.io>"]
edition = "2021"
license = "MIT"

[lib]
name = "wafy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
raw-window-handle = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
